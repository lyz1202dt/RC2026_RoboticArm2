model:
  active_joints: [joint1, joint2, joint3, joint4, joint5, joint6]

data:
  sample_time: 0.02
  decimate: false
  decimation_factor: 10
  max_samples: 0
  acceleration_source: computed
  acceleration_smoothing_window: 11
  acceleration_smoothing_polyorder: 3

trajectory_generation:
  duration: 8.0
  sample_time: 0.02
  harmonics: 5
  attempts: 250
  seed: 20051202
  limit_margin_ratio: 0.12
  velocity_limit_ratio: 0.5
  acceleration_limit: 8.0
  ground_clearance: 0.02
  ground_check_links: [link2, link3, link4, link5, link6]

identification:
  zero_tolerance: 1.0e-8
  qr_tolerance: 1.0e-8
  weighted_least_squares: false
  has_friction: false
  has_actuator_inertia: false
  has_joint_offset: false

reconstruction:
  enabled: true
  method: sdp
  prior_source: urdf
  physical_projection: false
  strict_base_constraints: false
  base_residual_weight: 1.0e6
  mass_min: 1.0e-3
  projection_psd_floor: 1.0e-9
  psd_eig_tol: 1.0e-9
  inertia_eig_tol: -1.0e-9
  solver: cvxopt
  max_seconds:
  require_physical: true
  prior_weights:
    enabled: true
    weights:
      mass: 1.0
      first_moment: 10.0
      inertia_diagonal: 50.0
      inertia_offdiagonal: 50.0
  shape_prior:
    enabled: true
    length_scale_min: 0.5
    length_scale_max: 2.0
    min_length_abs: 0.0
  central_moment_prior:
    enabled: true
    weight: 200.0
    diagonal_weight: 1.0
    offdiagonal_weight: 4.0
    min_scale: 1.0e-5
  tensor_trust_region:
    enabled: true
    diagonal_scale_min: 0.8
    diagonal_scale_max: 1.3
    diagonal_abs_margin: 0.0
    offdiag_abs_margin: 0.0
    offdiag_rel_margin: 0.5
    offdiag_diag_fraction: 0.01
    linearized_com_offdiagonal: true
    com_offdiag_abs_margin: 0.0
    com_offdiag_rel_margin: 0.5
    com_offdiag_diag_fraction: 0.01
  cad_constraints:
    source: urdf
    mass_scale_min: 0.8
    mass_scale_max: 1.2
    com_margin_abs: 0.002
    com_margin_rel: 0.1

output:
  write_report: true
